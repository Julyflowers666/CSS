<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href = "estilo.css"><style>
        .contanier{
            margin: auto;
            width: 100%;
            height: 800px;
        }  
        .cabecalho{ 
            background-color: rgb(255, 0, 195);
            height: 150px;
            width: 100%;
            margin: auto;

            font-size: 40px;
            text-align: center;
            align-items: center;
            align-content: center;
        }
        .cima{
            background-color: rgb(211, 20, 157);
            height: 100px;
            width: 80%;
            float: left;
            margin-top: 10px;
            float: right;

            font-size: 30px;
            text-align: center;
            align-items: center;
            align-content: center;
        }
        .esquerda{
            background-color: rgb(220, 15, 97);
            height: 470px;
            width: 49%;
            margin: auto;
            float: left;
            margin-top: 10px;

            font-size: 20px;
            text-align: center;
            align-items: center;
            align-content: center;
        }
        .direita{
            background-color: rgb(255, 0, 76);
            height: 470px;
            width: 49%;
            margin: auto;
            float: right;
            margin-top: 10px;

            font-size: 20px;
            text-align: center;
            align-items: center;
            align-content: center;
        }
        .matriz{
            width: 80%;
            height: 500px;
            margin-top: 5px;
            float: right;

        }
        .lado{
            background-color: rgb(226, 43, 131);
            height: 585px;
            width: 19%;
            margin: auto;
            margin-top: 10px;
            float: left;
            
            font-size: 30px;
            text-align: center;
            align-items: center;
            align-content: center;
            
        }
        .rodape{
            background-color: rgb(206, 9, 187);
            height: 50px;
            width: 100%;
            margin: auto;
            margin-top: 10px;
            
            font-size: 30px;
            text-align: center;
            align-items: center;
            align-content: center;

        }
    </style>
</head>
<body>
    <div class="contanier"> 
        <div class = "cabecalho"> cabeçalho </div>
        <div class="lado">lado esquerda</div>
        <div class= "cima">parte de cima</div>
        <div class="matriz">
            <div class = "esquerda"> esquerda </div>
            <div class = "direita"> direita </div>
        </div>
        <div class="rodape">rodape</div>
    </div>
</body>
</html>
