<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divisões Coloridas</title>
    <link rel="stylesheet" href = "estilo.css">
    <style>
        .cabecalho{
            background-color: cadetblue;
            height: 150px;
            width: 100%;
            margin-bottom: 20px;

            text-align: center;
            align-items: center;
            align-content: center;
        }
        .menu{
            background-color: aquamarine;
            height: 100px;
            width: 100%;
            margin-bottom: 20px;
        }
        .principal{
            background-color: blue;
            height: 600px;
            width: 100%;
            margin-bottom: 20px;
        }
        .esquerda{
            background-color: rgb(0, 251, 255);
            height: 150px;
            width: 50%;
            margin: auto;
            float: left;
            margin-top: 10px;
        }
        .direita{
            background-color: rgb(0, 102, 255);
            height: 150px;
            width: 50%;
            margin: auto;
            float: right;
            margin-top: 10px;
        }
        .matriz{
            width: 100%;
            margin: auto;
        }
        .rodape{
            background-color: rgb(102, 0, 255);
            margin:auto;
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class = "cabecalho"> aqui é o cabeçalho do site </div>
    <div class = "menu"> aqui é o menu do site</div>
    <div class = "principal"> esta é a pagina principal do site </div>

    <div class = "matriz">
        <div class = "esquerda"> coluna a esquerda do site </div>
        <div class = "direita"> coluna a direita do site </div>
    </div>

    <div class = "rodape"> parte de baixo do site </div>
</body>
</html>
