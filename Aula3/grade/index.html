<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades</title>
    <link rel="stylesheet" href = "estilo.css">
    <style>
        .cabecalho{
            background-color: crimson;
            height: 150px;
            width: 90%;
            margin: auto;
            margin-top: 5px;
        }
        .menu{
            background-color: darkmagenta;
            height: 100px;
            width: 90%;
            margin: auto;
            margin-top: 5px;
        }
        .container{
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            width: 90%;
            background-color:blueviolet;
            margin: auto;
            margin-top: 5px;
        }
        .item{
            background-color:deeppink;
            border-radius: 5px;
            margin: 2px;
            text-align: center;
            height: 150px;
            align-items: center;
            align-content: center;

        }
        .divisao{
            display: grid;
            grid-template-columns: 1fr 1fr;
            width: 90%;
            background-color: rgb(30, 0, 139);
            margin: auto;
            margin-top: 5px;
            
        }

    </style>
</head>
<body>
    <div class="cabecalho"></div>
    <div class="menu">MENUIAJFJA</div>
    <div class="container">
        <div class="item">Div 1</div>
        <div class="item">Div 2</div>
        <div class="item">Div 3</div>
        <div class="item">Div 4</div>
        <div class="item">Div 5</div>
        <div class="item">Div 6</div>
    </div>
    <div class="divisao">
        <div class="item">Div 1</div>
        <div class="item">Div 2</div>
    </div>
</body>
</html>
